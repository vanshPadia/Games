name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master # Change to 'master' if your main branch is named master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Application
        run: npm run build

      - name: Deploy Frontend Assets
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Targets the exact 'dist' folder your Vite build created
          artifact-name: github-pages
          # Points directly to your static client folder
          path: "./dist"
